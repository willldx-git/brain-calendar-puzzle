  <style>

    .pieces-panel{padding:18px 20px}.pieces-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.pieces-head h2{margin:0;font-size:16px}.piece-count{font-size:12px;color:var(--muted)}.piece-tools{display:flex;gap:8px;margin:12px 0 14px}.tool-btn{flex:1;background:white;border:1px solid var(--line);border-radius:11px;padding:8px;color:#4c4c45;font-size:12px;font-weight:750}.tool-btn:hover{border-color:#f0a581;color:var(--orange-dark)}.piece-tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:205px}.piece{--piece-color:#ee7139;display:grid;gap:3px;padding:9px 7px;border:1px solid #eee3d5;background:#faf6ee;border-radius:13px;align-content:center;justify-content:center;min-height:68px;touch-action:none;user-select:none;cursor:grab;transition:.15s}.piece:hover{border-color:#f0a581;transform:translateY(-2px)}.piece.selected{border-color:#eadbcf;background:#fffaf5;box-shadow:0 3px 12px #9d633012}.piece.selected .mini-grid{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px var(--orange-dark))}.piece.dragging{opacity:.45}.mini-grid{display:grid;gap:3px}.mini-cell{width:100%;height:100%;min-width:0;min-height:0;border:1px solid var(--piece-edge,transparent);border-radius:3px;background:var(--piece-color);box-shadow:inset 0 1px 0 #ffffff70}.piece-label{display:none}.tray-empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--green);font-weight:750;font-size:14px;line-height:1.7;padding:20px}.help-card{padding:15px 18px}.help-card h3{font-size:13px;margin:0 0 8px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{font-size:11px;color:var(--muted);line-height:1.45}.step b{display:block;color:#383a34;font-size:12px;margin-bottom:2px}.step i{display:inline-grid;place-items:center;font-style:normal;width:19px;height:19px;border-radius:7px;background:#fff0e7;color:var(--orange-dark);font-size:10px;margin-right:4px;font-weight:850}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);background:#282b25;color:white;padding:12px 17px;border-radius:13px;box-shadow:0 10px 30px #0003;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.win{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#35281b40,#252820b8 70%);display:none;place-items:center;padding:20px;z-index:20;overflow:hidden}.win.show{display:grid;animation:veilIn .25s ease-out}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti-piece{position:absolute;top:-5vh;width:var(--size);height:calc(var(--size)*1.45);border-radius:2px;opacity:0;animation:confettiFall var(--fall) var(--delay) cubic-bezier(.22,.65,.3,1) forwards}.win-card{position:relative;z-index:1;max-width:410px;width:100%;background:linear-gradient(145deg,#fffefa,#fff5e6);border:1px solid #f0dcc1;border-radius:26px;text-align:center;padding:34px 32px 30px;box-shadow:0 25px 80px #0004,0 0 0 8px #fff2;animation:winPop .62s cubic-bezier(.16,1.25,.35,1) both}.win-card:before{content:"";position:absolute;z-index:-1;inset:-14px;border-radius:34px;background:conic-gradient(from 25deg,#ffc93d66,#f04a7866,#32b67566,#1688df66,#ffc93d66);filter:blur(20px);opacity:.52}.win-emoji{display:grid;place-items:center;width:82px;height:82px;margin:0 auto 8px;border-radius:26px;background:linear-gradient(145deg,#fff0bd,#ffd978);font-size:48px;box-shadow:0 8px 22px #d89b3a38;animation:partyBounce .9s .18s both}.win-card h2{margin:7px 0;font-size:29px;color:#37291c}.win-card p{color:var(--muted);line-height:1.6}.win-card button{border:0;border-radius:14px;background:linear-gradient(135deg,#f4772d,#e94b31);color:white;font-weight:850;padding:13px 23px;box-shadow:0 6px 14px #df5c3040;transition:transform .16s,box-shadow .16s}.win-card button:hover{transform:translateY(-2px);box-shadow:0 9px 20px #df5c3055}@keyframes veilIn{from{opacity:0}to{opacity:     .app{max-width:1340px}.topbar{margin-bottom:17px}.layout{grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);align-items:stretch}.board-panel{height:100%;display:block;padding:20px}.board-main{height:100%;display:flex;flex-direction:column;min-width:0}.board-head{gap:14px;align-items:center;flex-wrap:wrap}.board-head h2{flex:none}.board-head-right{display:flex;align-items:center;justify-content:flex-end;flex:1 1 450px;flex-wrap:wrap;gap:10px}.goal-inline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}.goal-label{font-size:12px;color:var(--muted);font-weight:700}.goal-flips{display:flex;gap:6px}.flip-tile{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:56px;height:42px;padding:3px 8px;border:1px solid #e9dfd2;border-radius:9px;background:linear-gradient(180deg,#fffdf8 0 49%,#efe7dc 50%,#fffaf3 52% 100%);box-shadow:0 2px 4px #4937210b;text-align:center}.flip-tile.week{min-width:76px}.flip-caption{font-size:8px;line-height:1;color:#928a7d;letter-spacing:.08em}.flip-tile strong{font-size:15px;line-height:1.25;color:#38392f;font-weight:850}.board-head-actions{display:flex;gap:7px}.icon-action{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:11px;background:#fffaf2;color:#57574f;font-weight:700;transition:background .15s,border-color .15s,transform .15s}.icon-action:hover{background:white;border-color:#e3cbb8;transform:translateY(-1px)}.icon-action .button-icon{display:grid;place-items:center;flex:none;color:#51534b}.icon-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-action .button-label{font-size:10px;line-height:1;color:#8a887f;font-weight:650}.board-head-actions .icon-action{min-width:58px;min-height:44px;padding:6px 9px;flex-direction:column;gap:3px}.goal-change{padding:5px 3px;border:0;background:transparent;color:var(--orange-dark);font-size:10px;font-weight:750}.board-wrap{flex:1}.side{height:100%;display:flex;flex-direction:column}.pieces-panel{height:100%;flex:1;display:flex;flex-direction:column;min-height:0}.piece-tools{margin:10px 0}.piece-tools .icon-action{flex:1;min-height:52px;flex-direction:column;gap:4px}.piece-tools .button-icon svg{width:21px;height:21px}.piece-tools .button-label{font-size:10px;color:#89877f}.piece-tray{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(64px,1fr));flex:1;min-height:0;gap:8px}.piece{min-height:0;padding:6px}.cell.month.preview,.cell.weekday.preview{background:#ffd8ad;border-color:#f4a24d;color:#79431d}.cell.month.invalid,.cell.weekday.invalid{background:#f3a39a;border-color:#dc6c62;color:#772f2c}.cell.covered.invalid.blocked-occupied{background:#d97970!important;border-color:#b9504d!important;color:#fff!important}.cell.invalid.blocked-target{background:#c95f5c!important;border-color:#983c3a!important;color:#fff!important;box-shadow:inset 0 0 0 3px #ffffff55!important}.cell.invalid.blocked-target:after{content:"保留";position:absolute;right:3px;bottom:2px;font-size:8px;font-weight:850;color:#fff}.cell.empty.invalid{opacity:1;border-style:solid;background:#e78b82;border-color:#c95f5c}.cell.target:not(.preview):not(.invalid){background:#ffbd98;border-color:#ef5b27;box-shadow:inset 0 0 0 2px #ffeadd,0 2px 6px #d85b2733;color:#762b0b}.cell.target:not(.preview):not(.invalid):after{content:"目标";position:absolute;top:3px;right:5px;font-size:7px;letter-spacing:.04em;color:#a63c12;opacity:.95}
    @media(max-width:850px){.layout{grid-template-columns:1fr;align-items:start}.board-panel{height:auto}.side,.pieces-panel{height:auto}.piece-tray{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none;min-height:140px;flex:none}.piece{min-height:82px;padding:9px 7px}}

      html,body{height:100%;overflow:hidden}
      .app{height:100vh;height:100svh;max-height:100svh;display:flex;flex-direction:column;padding:clamp(10px,1.8vh,18px) clamp(16px,2vw,28px)}

<body>
  <main class="app">
    <input id="datePicker" type="date" aria-label="选择目标日期" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
    <section class="layout">
      <section class="panel board-panel">
        <div class="board-main"><div class="panel-head board-head"><h2 class="board-title"><span class="sr-only">日历棋盘</span><svg class="board-title-icon" viewBox="0 0 48 48" role="img" aria-label="烧脑日历图标" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="calIconBg" x1="4" y1="3" x2="43" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#ff8248"/><stop offset="1" stop-color="#e95120"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="13" fill="url(#calIconBg)"/><path d="M13 10v4M35 10v4" stroke="#fff8e9" stroke-width="2.6" stroke-linecap="round"/><rect x="10" y="12" width="28" height="26" rx="6" fill="#fffaf0"/><path d="M10 18a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v2H10z" fill="#ffe0c9"/><path d="M16 12h16a6 6 0 0 1 6 6v2H10v-2a6 6 0 0 1 6-6Z" fill="#fff0df"/><rect x="15" y="23" width="7" height="6" rx="2" fill="#1680d9"/><rect x="23" y="23" width="7" height="6" rx="2" fill="#32a762"/><rect x="31" y="23" width="4" height="6" rx="1.5" fill="#f5b91f"/><rect x="15" y="30" width="7" height="5" rx="2" fill="#e52b91"/><path d="M26.5 30h5a2 2 0 0 1 2 2v3h-7z" fill="#f47b20"/><circle cx="33.5" cy="33.5" r="1.4" fill="#fffaf0"/></svg><span class="board-title-label">烧脑日历</span></h2><div class="board-head-right"><div class="goal-inline"><span class="goal-label">目标</span><div class="goal-flips"><span class="flip-tile"><span class="flip-caption">月份</span><strong id="targetMonthValue">—</strong></span><span class="flip-tile day"><span class="flip-caption">日期</span><strong id="targetDayValue">—</strong></span><span class="flip-tile week"><span class="flip-caption">星期</span><strong id="targetWeekdayValue">—</strong></span></div><button class="icon-action goal-change" id="datePickerBtn" aria-label="更换目标日期"><span class="button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M7.5 3.5v4M16.5 3.5v4M4 9.5h16M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01"/></svg></span><span class="button-label">换日期</span></button></div><div class="board-head-actions"><button class="icon-action" id="undoBtn" aria-label="撤销"><span class="button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6.5 6.5 0 1 1 0 13h-2"/></svg></span><span class="button-label">撤销</span></button><button class="icon-action" id="resetBtn" aria-label="重开本局"><span class="button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 1-2.1-5.2"/></svg></span><span class="button-label">重开</span></button></div></div></div>
          <div class="board-wrap"><div class="board" id="board" aria-label="日历拼图棋盘"></div></div>
          <div class="board-hint"><span id="dragHint" aria-live="polite">把拼块拖到棋盘上，<strong>靠近格子会自动吸附</strong></span><span id="progress">0 / 47 格</span></div>
        </div>
      </section>
      <aside class="side">
        <section class="panel pieces-panel"><div class="pieces-head"><h2>拼块</h2><span class="piece-count" id="pieceCount">—</span></div><div class="piece-tools"><button class="icon-action" id="rotateBtn" aria-label="旋转"><span class="button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 1-2.2-5.4"/></svg></span><span class="button-label">旋转</span></button><button class="icon-action" id="flipBtn" aria-label="翻转"><span class="button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M5 8h14M5 8l3-3M5 8l3 3M19 16H5M19 16l-3-3M19 16l-3 3"/></svg></span><span class="button-label">翻转</span></button></div><div class="piece-tray" id="pieceTray"></div></section>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div class="win" id="win"><div class="confetti" id="confetti" aria-hidden="true"></div><div class="win-card"><div class="win-emoji">🎉</div><h2>拼出来了！</h2><p id="winMessage">今天的日期已经完整露出。</p><button id="winClose">继续挑战</button></div></div>
  <script>
    (()=>{
      const W=8,H=8,weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      const labels=new Map();
      for(let m=1;m<=6;m++)labels.set(`${0},${m-1}`,{id:`m${m}`,text:`${m}月`,type:'month',value:m});
      for(let m=7;m<=12;m++)labels.set(`${1},${m-7}`,{id:`m${m}`,text:`${m}月`,type:'month',value:m});
      for(let d=1;d<=28;d++){const n=d-1;labels.set(`${2+Math.floor(n/7)},${n%7}`,{id:`d${d}`,text:`${d}日`,type:'day',value:d})}
      for(let d=29;d<=31;d++)labels.set(`${6},${d-29}`,{id:`d${d}`,text:`${d}日`,type:'day',value:d});
      for(let i=0;i<7;i++){const r=i<4?6:7,c=i<4?i+3:i;labels.set(`${r},${c}`,{id:`w${i}`,text:weekdays[i],type:'weekday',value:i})}
      const pieceSpecs=[
        {id:'p0',color:'#2FA95D',edge:'#218246',cells:[[0,0],[1,0],[2,0],[2,1],[2,2]]},
        {id:'p1',color:'#8C47C7',edge:'#6B32A0',cells:[[1,5],[2,5],[0,6],[1,6],[2,6]]},
        {id:'p2',color:'#0874D5',edge:'#0759A4',cells:[[3,0],[4,0],[4,1],[3,2],[4,2]]},
        {id:'p3',color:'#F4B91E',edge:'#CF9411',cells:[[6,3],[6,4],[6,5],[6,6]]},
        {id:'p4',color:'#E22C89',edge:'#AF1D66',cells:[[5,0],[5,1],[5,2],[6,2]]},
        {id:'p5',color:'#35414D',edge:'#202A33',cells:[[5,4],[3,5],[4,5],[5,5],[3,6]]},
        {id:'p6',color:'#F37B1D',edge:'#C75D0B',cells:[[0,1],[1,1],[0,2],[0,3],[0,4]]},
        {id:'p7',color:'#0AA88C',edge:'#07826C',cells:[[1,2],[1,3],[2,3],[3,3],[1,4]]},
        {id:'p8',color:'#F0443D',edge:'#C4312D',cells:[[4,6],[5,6],[5,7],[6,7]]},
        {id:'p9',color:'#8C5B35',edge:'#684226',cells:[[4,3],[5,3],[4,4],[3,4],[2,4]]}
      ];
      const board=document.querySelector('#board'),tray=document.querySelector('#pieceTray'),toast=document.querySelector('#toast');
      let targetDate=new Date(),targetIds=new Set(),pieces=[],placements=new Map(),selected=null,drag=null,initial=null,undoStack=[];
      const key=(r,c)=>`${r},${c}`;
      function dateInfo(date){return{month:date.getMonth()+1,day:date.getDate(),weekday:date.getDay()}}
      function cellsFor(date){const x=dateInfo(date);return new Set([`m${x.month}`,`d${x.day}`,`w${x.weekday}`])}
      function targetName(date){return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日 ${weekdays[date.getDay()]}`}
      let outlineLayer=null;
      function drawPieceOutline(id){if(!outlineLayer)return;outlineLayer.replaceChildren();const piece=pieces.find(p=>p.id===id),pos=placements.get(id);if(!piece||!pos)return;const boardRect=board.getBoundingClientRect(),gap=(parseFloat(getComputedStyle(board).gap)||0)/2,shape=new Set(piece.cells.map(c=>key(c.y,c.x))),segments=[];for(const c of piece.cells){const el=board.querySelector(`.cell[data-key="${key(pos.y+c.y,pos.x+c.x)}"]`);if(!el)continue;const r=el.getBoundingClientRect(),x=r.left-boardRect.left-gap,y=r.top-boardRect.top-gap,w=r.width+gap*2,h=r.height+gap*2;if(!shape.has(key(c.y-1,c.x)))segments.push(`M${x},${y}H${x+w}`);if(!shape.has(key(c.y,c.x+1)))segments.push(`M${x+w},${y}V${y+h}`);if(!shape.has(key(c.y+1,c.x)))segments.push(`M${x+w},${y+h}H${x}`);if(!shape.has(key(c.y,c.x-1)))segments.push(`M${x},${y+h}V${y}`)}const d=segments.join(' ');for(const [stroke,width,opacity]of [['#34271f',5,.26],['#fffaf2',2.5,.96]]){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke',stroke);path.setAttribute('stroke-width',width);path.setAttribute('stroke-opacity',opacity);path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');outlineLayer.append(path)}}
      function clearPieceOutline(){if(placements.has(selected))drawPieceOutline(selected);else outlineLayer?.replaceChildren()}
      window.addEventListener('resize',()=>{if(placements.has(selected))drawPieceOutline(selected)});
      function buildBoard(){board.innerHTML='';for(let r=0;r<H;r++)for(let c=0;c<W;c++){const label=labels.get(key(r,c));const el=document.createElement('div');el.className='cell'+(!label?' empty':'');el.dataset.key=key(r,c);if(label){el.dataset.id=label.id;el.textContent=label.text;el.classList.add(label.type)}board.append(el)}outlineLayer=document.createElementNS('http://www.w3.org/2000/svg','svg');outlineLayer.classList.add('outline-layer');board.append(outlineLayer);board.onpointerdown=e=>{const cell=e.target.closest('.cell.covered');if(cell&&cell.dataset.piece){const piece=pieces.find(p=>p.id===cell.dataset.piece),pos=placements.get(cell.dataset.piece),[r,c]=cell.dataset.key.split(',').map(Number),grab=piece.cells.find(q=>q.x+pos.x===c&&q.y+pos.y===r);if(piece)startDrag(e,piece.id,cell,grab)}};board.onclick=e=>{const cell=e.target.closest('.cell.covered');if(cell&&cell.dataset.piece){selected=cell.dataset.piece;renderBoard()}};board.onpointerover=e=>{const cell=e.target.closest('.cell.covered');if(cell)drawPieceOutline(cell.dataset.piece)};board.onpointerout=e=>{if(e.target.closest('.cell.covered'))clearPieceOutline()}}
      // These ten connected 4/5-cell pieces follow the colored outlines in the reference image.
      // With rotations and flips, this fixed set tiles every calendar date.
      function partition(){return pieceSpecs.map(p=>{const minX=Math.min(...p.cells.map(([x])=>x)),minY=Math.min(...p.cells.map(([,y])=>y));return{id:p.id,color:p.color,edge:p.edge,cells:p.cells.map(([x,y])=>({x:x-minX,y:y-minY}))}})}
      function normalize(cells){const minX=Math.min(...cells.map(p=>p.x)),minY=Math.min(...cells.map(p=>p.y));return cells.map(p=>({x:p.x-minX,y:p.y-minY}))}
      function changeShape(piece,transform){const before=piece.cells.map(c=>({...c})),next=normalize(transform(piece.cells));const pos=placements.get(piece.id);piece.cells=next;if(pos&&!canPlace(piece,pos.x,pos.y,piece.id)){piece.cells=before;toastMsg('这个方向无法留在当前位置，请先移到待选区');return false}undoStack.push({type:'shape',id:piece.id,cells:before});renderBoard();renderTray();return true}
      function rotate(piece){return changeShape(piece,cells=>cells.map(p=>({x:-p.y,y:p.x})))}
      function flip(piece){return changeShape(piece,cells=>cells.map(p=>({x:-p.x,y:p.y})))}
      function pieceGrid(piece){const maxX=Math.max(...piece.cells.map(p=>p.x)),maxY=Math.max(...piece.cells.map(p=>p.y));const g=document.createElement('div');g.className='mini-grid';g.dataset.cols=maxX+1;g.dataset.rows=maxY+1;g.style.setProperty('--piece-color',piece.color);g.style.setProperty('--piece-edge',piece.edge||'transparent');for(let y=0;y<=maxY;y++)for(let x=0;x<=maxX;x++){const cell=document.createElement('i');cell.className='mini-cell';cell.dataset.x=x;cell.dataset.y=y;cell.style.visibility=piece.cells.some(p=>p.x===x&&p.y===y)?'visible':'hidden';g.append(cell)}return g}
      function sizePieceGrid(grid,card){const cols=Number(grid.dataset.cols),rows=Number(grid.dataset.rows),gap=3;const width=Math.max(0,card.clientWidth-18),height=Math.max(0,card.clientHeight-18);const size=Math.max(12,Math.min(72,Math.floor(Math.min((width-gap*(cols-1))/cols,(height-gap*(rows-1))/rows))));grid.style.gridTemplateColumns=`repeat(${cols},${size}px)`;grid.style.gridAutoRows=`${size}px`}
      function renderTray(){tray.innerHTML='';const remaining=pieces.filter(p=>!placements.has(p.id));document.querySelector('#pieceCount').textContent=`${remaining.length} 块待摆放`;for(const p of remaining){const el=document.createElement('div');el.className='piece'+(selected===p.id?' selected':'');el.dataset.piece=p.id;el.style.setProperty('--piece-color',p.color);el.style.setProperty('--piece-edge',p.edge||'transparent');const grid=pieceGrid(p);el.append(grid);el.addEventListener('pointerdown',e=>{const hit=e.target.closest('.mini-cell');let grab=hit?{x:Number(hit.dataset.x),y:Number(hit.dataset.y)}:p.cells[0];startDrag(e,p.id,el,grab)});el.addEventListener('click',()=>{selected=p.id;renderTray()});tray.append(el);sizePieceGrid(grid,el)}if(!remaining.length){const done=document.createElement('div');done.className='tray-empty';done.innerHTML='拼块全部就位<br>目标日期已经露出 ✨';tray.append(done)}}
      window.addEventListener('resize',()=>{for(const card of tray.querySelectorAll('.piece')){const grid=card.querySelector('.mini-grid');if(grid)sizePieceGrid(grid,card)}});
      function renderBoard(preview=null){for(const el of board.children){el.classList.remove('target','covered','preview','invalid','blocked-target','blocked-occupied','blocked-empty');el.style.removeProperty('--cover-color');el.style.removeProperty('--cover-edge');delete el.dataset.piece;const cellKey=el.dataset.key;if(!cellKey)continue;const id=el.dataset.id;if(id){if(targetIds.has(id))el.classList.add('target');for(const [pid,pos]of placements){const p=pieces.find(x=>x.id===pid);if(p.cells.some(c=>pos.x+c.x===Number(cellKey.split(',')[1])&&pos.y+c.y===Number(cellKey.split(',')[0]))){el.classList.add('covered');el.dataset.piece=pid;el.style.setProperty('--cover-color',p.color);el.style.setProperty('--cover-edge',p.edge||p.color)}}}if(preview){const covered=preview.cells.find(c=>key(c.y+preview.y,c.x+preview.x)===cellKey);if(covered){el.classList.add(preview.valid?'preview':'invalid');const blocker=preview.blocked.find(b=>b.x===covered.x+preview.x&&b.y===covered.y+preview.y);if(blocker)el.classList.add(`blocked-${blocker.reason}`)}}}if(placements.has(selected))drawPieceOutline(selected);else outlineLayer?.replaceChildren()}
      function celebrate(){const layer=document.querySelector('#confetti'),colors=['#2FA95D','#8C47C7','#0874D5','#F4B91E','#E22C89','#35414D','#F37B1D','#0AA88C','#F0443D','#8C5B35'];layer.replaceChildren();for(let i=0;i<72;i++){const bit=document.createElement('i');bit.className='confetti-piece';bit.style.left=`${Math.random()*100}%`;bit.style.setProperty('--size',`${7+Math.random()*7}px`);bit.style.setProperty('--fall',`${2.8+Math.random()*2.1}s`);bit.style.setProperty('--delay',`${Math.random()*.9}s`);bit.style.setProperty('--drift',`${Math.round(Math.random()*240-120)}px`);bit.style.setProperty('--spin',`${Math.round(Math.random()*1000-500)}deg`);bit.style.background=colors[i%colors.length];bit.style.borderRadius=i%4===0?'50%':'2px';layer.append(bit)}clearTimeout(layer._clearTimer);layer._clearTimer=setTimeout(()=>layer.replaceChildren(),5700)}
      function allFilled(){return pieces.every(p=>placements.has(p.id))}
      function progress(){let count=0;for(const p of pieces)if(placements.has(p.id))count+=p.cells.length;document.querySelector('#progress').textContent=`${count} / ${labels.size-3} 格`}
      function toastMsg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),1900)}
      function snap(e){const rect=board.getBoundingClientRect(),gap=Number.parseFloat(getComputedStyle(board).gap)||0,cw=(rect.width-gap*(W-1))/W,ch=(rect.height-gap*(H-1))/H;return{x:Math.floor((e.clientX-rect.left)/(cw+gap)),y:Math.floor((e.clientY-rect.top)/(ch+gap)),cw,ch,gap}}
      function placementCheck(piece,x,y,ignore=null){const blocked=[];for(const c of piece.cells){const xx=x+c.x,yy=y+c.y,k=key(yy,xx);if(xx<0||xx>=W||yy<0||yy>=H||!labels.has(k)){blocked.push({x:xx,y:yy,reason:'empty'});continue}if(targetIds.has(labels.get(k).id)){blocked.push({x:xx,y:yy,reason:'target'});continue}for(const [pid,pos]of placements){if(pid===ignore)continue;const other=pieces.find(p=>p.id===pid);if(other.cells.some(o=>o.x+pos.x===xx&&o.y+pos.y===yy)){blocked.push({x:xx,y:yy,reason:'occupied'});break}}}return{valid:blocked.length===0,blocked}}
      function canPlace(piece,x,y,ignore=null){return placementCheck(piece,x,y,ignore).valid}
      function updateDragHint(check){const hint=document.querySelector('#dragHint');if(!hint)return;const message=check?.valid?'这个位置可以放置':check?.blocked.some(b=>b.reason==='target')?'红色“保留”格是目标日期，不能覆盖':check?.blocked.some(b=>b.reason==='occupied')?'红色格子已有拼块，不能重叠':'拼块不能放在空白格或棋盘外';if(hint.textContent!==message)hint.textContent=message}
      function resetDragHint(){const hint=document.querySelector('#dragHint');if(hint)hint.innerHTML='把拼块拖到棋盘上，<strong>靠近格子会自动吸附</strong>'}
      function moveGhost(e){if(!drag?.ghost)return;const {cw,ch,ghostGap,grab}=drag;drag.ghost.style.left=`${e.clientX-(grab.x*(cw+ghostGap)+cw/2)}px`;drag.ghost.style.top=`${e.clientY-(grab.y*(ch+ghostGap)+ch/2)}px`}
      function startDrag(e,id,el,grabHint=null){e.preventDefault();selected=id;const placed=placements.get(id),p=pieces.find(x=>x.id===id);if(placed){initial={id,pos:placed};const cell=e.target.closest('.cell.covered');if(cell){const [r,c]=cell.dataset.key.split(',').map(Number);grabHint=p.cells.find(q=>q.x+placed.x===c&&q.y+placed.y===r)||grabHint}placements.delete(id);renderBoard()}else{initial=null;el.classList.add('selected')}const grab=grabHint||p.cells[0],metrics=snap(e),ghost=document.createElement('div'),grid=pieceGrid(p),ghostGap=1;ghost.className='drag-ghost';grid.style.gridTemplateColumns=`repeat(${Math.max(...p.cells.map(c=>c.x))+1},${metrics.cw}px)`;grid.style.gridAutoRows=`${metrics.ch}px`;grid.style.gap=`${ghostGap}px`;ghost.append(grid);document.body.append(ghost);drag={id,el,pointerId:e.pointerId,last:null,ghost,grab,cw:metrics.cw,ch:metrics.ch,gap:metrics.gap,ghostGap};moveGhost(e);el.classList.add('dragging');el.setPointerCapture(e.pointerId);document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag,{once:true});document.addEventListener('pointercancel',cancelDrag,{once:true})}
      function moveDrag(e){if(!drag)return;const p=pieces.find(x=>x.id===drag.id),s=snap(e),x=s.x-drag.grab.x,y=s.y-drag.grab.y,check=placementCheck(p,x,y,drag.id);drag.last={...s,x,y,...check};moveGhost(e);renderBoard({...s,x,y,cells:p.cells,...check});updateDragHint(check)}
      function endDrag(e){document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointercancel',cancelDrag);if(!drag)return;const p=pieces.find(x=>x.id===drag.id),s=drag.last,rect=board.getBoundingClientRect(),outside=e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom,tap=!s;drag.el.classList.remove('dragging');drag.ghost.remove();if(tap){if(initial){placements.set(initial.id,initial.pos);renderBoard();progress()}drag=null;initial=null;resetDragHint();return}if(outside&&initial){undoStack.push({type:'return',id:p.id,pos:initial.pos});selected=null;toastMsg('拼块已移回待选区')}else if(s&&s.valid){placements.set(p.id,{x:s.x,y:s.y});undoStack.push(initial?{type:'move',id:p.id,pos:initial.pos}:{type:'place',id:p.id});selected=null;if(allFilled()){renderTray();renderBoard();progress();document.querySelector('#winMessage').textContent=`${targetName(targetDate)}，拼图完成！`;celebrate();document.querySelector('#win').classList.add('show')}}else if(initial){placements.set(initial.id,initial.pos);toastMsg('原位置已恢复')}else if(s){const msg=s.blocked.some(b=>b.reason==='target')?'这个位置压到了目标日期，目标格需要保留':s.blocked.some(b=>b.reason==='occupied')?'这里已有拼块，不能重叠':'拼块不能放在空白格或棋盘外';toastMsg(msg)}drag=null;initial=null;renderBoard();renderTray();progress();resetDragHint()}
      function cancelDrag(){document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);if(!drag)return;drag.el.classList.remove('dragging');drag.ghost.remove();if(initial)placements.set(initial.id,initial.pos);drag=null;initial=null;renderBoard();renderTray();progress();resetDragHint()}
      function setup(date){const nextDate=new Date(date.getFullYear(),date.getMonth(),date.getDate()),nextTargets=cellsFor(nextDate);let nextPieces;try{nextPieces=partition(nextDate)}catch{toastMsg('这个日期暂时无法生成连通拼块，请换个日期');return false}targetDate=nextDate;targetIds=nextTargets;pieces=nextPieces;placements.clear();undoStack=[];selected=null;resetDragHint();document.querySelector('#targetMonthValue').textContent=`${targetDate.getMonth()+1}月`;document.querySelector('#targetDayValue').textContent=`${targetDate.getDate()}日`;document.querySelector('#targetWeekdayValue').textContent=weekdays[targetDate.getDay()];document.querySelector('#datePicker').value=`${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;buildBoard();renderBoard();renderTray();progress();document.querySelector('#win').classList.remove('show');return true}
      document.querySelector('#resetBtn').addEventListener('click',()=>{setup(targetDate);toastMsg('本局已重开')});
      document.querySelector('#undoBtn').addEventListener('click',()=>{const action=undoStack.pop();if(!action){toastMsg('没有可撤销的步骤');return}if(action.type==='move'||action.type==='return')placements.set(action.id,action.pos);else if(action.type==='shape'){const piece=pieces.find(p=>p.id===action.id);piece.cells=action.cells}else placements.delete(action.id);document.querySelector('#win').classList.remove('show');selected=null;renderBoard();renderTray();progress();toastMsg('已撤销上一步')});
      document.querySelector('#rotateBtn').addEventListener('click',()=>{const p=pieces.find(p=>p.id===selected);if(p)rotate(p)&&toastMsg('拼块已旋转');else if(!p)toastMsg('先选择一块拼块')});
      document.querySelector('#flipBtn').addEventListener('click',()=>{const p=pieces.find(p=>p.id===selected);if(p)flip(p)&&toastMsg('拼块已翻转');else if(!p)toastMsg('先选择一块拼块')});
      document.querySelector('#datePickerBtn').addEventListener('click',()=>{const picker=document.querySelector('#datePicker');picker.showPicker?picker.showPicker():picker.click()});
      document.querySelector('#datePicker').addEventListener('change',e=>{if(e.target.value){const [y,m,d]=e.target.value.split('-').map(Number);if(setup(new Date(y,m-1,d)))toastMsg('目标日期已更新');else e.target.value=`${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`}});
      document.querySelector('#winClose').addEventListener('click',()=>document.querySelector('#win').classList.remove('show'));
      setup(new Date());
    })();
  </script>
