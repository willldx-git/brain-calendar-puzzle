    body.dark-mode .flip-tile:hover,body.dark-mode .flip-tile:focus-visible{border-color:#718089;box-shadow:0 5px 12px #0005,inset 0 1px 0 #ffffff18;filter:brightness(1.12)}
    body.dark-mode .flip-caption{color:#b7c0c4}
    body.dark-mode .flip-number:before{color:#f0f3f4}
    body.dark-mode .flip-number:after{color:#d0d6d8}
    body.dark-mode .board-title-label,body.dark-mode .step b{color:var(--ink)}
    body.dark-mode .author-tooltip{background:#242a2e;border-color:#465057;color:#e0e5e7;box-shadow:0 12px 28px #0007}
    body.dark-mode .target-panel{background:#302923;border-color:#594535}
    body.dark-mode .target-cell{background:#252b2f;border-color:#465057;color:#e8c5aa}
    body.dark-mode .target-cell.week{color:#c0d8bd}
    body.dark-mode .icon-action,body.dark-mode .quiet-btn,body.dark-mode .tool-btn{background:#2a3035;border-color:#465057;color:#e0e5e7}
    body.dark-mode .icon-action .button-icon{color:#e0e5e7}
    body.dark-mode .icon-action .button-label{color:#aab2b7}
    body.dark-mode .icon-action:disabled,body.dark-mode .icon-action:disabled:hover{background:#2a3035;border-color:#465057}
    body.dark-mode .piece{background:#252b2f;border-color:#414a50}
    body.dark-mode .piece.selected{background:#30363b;border-color:#727d83;box-shadow:0 3px 12px #0005}
    body.dark-mode .piece.selected .mini-grid{filter:drop-shadow(0 0 1px #252b2f) drop-shadow(0 0 3px #ff9167)}
    body.dark-mode .mini-cell{box-shadow:inset 0 1px 0 #ffffff45}

    body.dark-mode .win-card h2{color:#fff1e7}
    body.dark-mode .win .win-card.standard-win{--party-edge:#ef9a67;--party-glow:#ff776b65;--party-star:#ffd6a7;--result-label:#f0c7b6;background:radial-gradient(ellipse at 50% 0,#733d3e,transparent 61%),linear-gradient(145deg,#352136,#31232b 66%,#4e2936)}
    body.dark-mode .win-card.standard-win #winTitle{color:#ffe4c5}
    body.dark-mode .win .win-card.new-solution{--win-sparkle:#dcc0ff;--result-label:#d8cbf1;background:radial-gradient(ellipse at 50% 0,#482b71,transparent 58%),linear-gradient(155deg,#211934,#1b223b);border-color:#9672e2;box-shadow:0 0 0 4px #b38aff32,0 0 36px #9055f579,0 25px 80px #0006}
    body.dark-mode .win-card.new-solution #winTitle{color:#ecddff}
    body.dark-mode .win .win-card.no-returns{--win-sparkle:#a3ffed;--result-label:#c1ebe9;--no-returns-title:#b5fff0;background:radial-gradient(ellipse at 50% 0,#205966,transparent 62%),linear-gradient(155deg,#122b39,#102137);border-color:#59ded6;box-shadow:0 0 0 4px #61e4dc35,0 0 32px #26bfcd72,0 25px 80px #0006}
    body.dark-mode .win .win-card.no-returns.smirk-revealed{--win-sparkle:#f5a6cf;--result-label:#f1c8dc;--no-returns-title:#ffc0df;background:radial-gradient(ellipse at 50% 0,#6b2d52,transparent 62%),linear-gradient(155deg,#331a32,#251b33);border-color:#db75ab;box-shadow:0 0 0 4px #e775b135,0 0 32px #d654a172,0 25px 80px #0006}

    button{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease,border-color .16s ease}
    @media(hover:hover){button:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 7px 16px #49372126;border-color:#e5b69b}button:not(:disabled):active{transform:translateY(0) scale(.98);filter:brightness(.98);box-shadow:0 2px 5px #49372120}body.dark-mode button:not(:disabled):hover{box-shadow:0 7px 18px #0006;border-color:#69747b}body.dark-mode button:not(:disabled):active{box-shadow:0 2px 5px #0005}}
    .goal-change:hover{background:transparent}.qr-continue-link:hover{color:#0059b8}
    body.dark-mode .goal-change:hover{background:transparent}body.dark-mode .qr-continue-link:hover{color:#61a9f7}

    body.board-transitioning .board-main,body.board-transitioning .pieces-panel{pointer-events:none}
    .board.is-shattering .cell:not(.empty){transform-origin:center;animation:calendarShardFall .5s var(--shard-delay,0ms) cubic-bezier(.42,0,.82,.32) both;will-change:transform,opacity,filter}
    .board.is-shattering .outline-layer{opacity:0;transition:opacity .16s ease}
    .board.is-forming .cell:not(.empty){transform-origin:center;animation:calendarCellForm .3s var(--form-delay,0ms) cubic-bezier(.2,.85,.25,1.16) both;will-change:transform,opacity,filter}
    @keyframes calendarShardFall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1);filter:brightness(1)}30%{opacity:1;transform:translate3d(0,-8px,0) rotate(3deg) scale(1.03);filter:brightness(1.12)}100%{opacity:0;transform:translate3d(var(--shard-x),var(--shard-y),0) rotate(var(--shard-rotate)) scale(.35);filter:brightness(.8) saturate(1.25)}}
    @keyframes calendarCellForm{0%{opacity:0;transform:translate3d(0,-18px,0) scale(.58) rotateX(-24deg);filter:blur(3px)}68%{opacity:1;transform:translate3d(0,2px,0) scale(1.04) rotateX(2deg);filter:blur(0)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotateX(0);filter:none}}
    @media(prefers-reduced-motion:reduce){.board.is-shattering .cell:not(.empty),.board.is-forming .cell:not(.empty){animation:none!important;will-change:auto}}

    #rotateBtn svg{display:block;width:22px;height:22px;overflow:hidden}
    #rotateBtn .rotate-arrow{fill:currentColor;stroke:none;transform-box:view-box;transform-origin:center}
    #rotateBtn:hover .rotate-arrow{animation:iconSpin 1.08s cubic-bezier(.4,0,.2,1)}
    #flipBtn .flip-solid{fill:currentColor}
    #flipBtn:hover svg{animation:iconFlip .62s ease-in-out;transform-box:fill-box;transform-origin:center}
    #hintBtn:not(:disabled):hover .button-icon{color:#e7a514}
    #hintBtn:not(:disabled):hover svg{animation:bulbGlow .78s ease-in-out;filter:drop-shadow(0 0 5px #f7c642)}
    #undoBtn:hover svg{animation:undoSweep .52s ease-in-out;transform-box:fill-box;transform-origin:35% 35%}
    #resetBtn:hover svg{animation:iconReset .62s cubic-bezier(.18,.72,.26,1)}
    #datePickerBtn:hover svg{animation:calendarNudge .5s ease-in-out}
    #themeToggle:hover[aria-pressed="false"] .theme-sun svg{animation:sunSpin .7s ease-in-out;filter:drop-shadow(0 0 4px #f7c642)}
    #themeToggle:hover[aria-pressed="true"] .theme-moon svg{animation:moonRock .58s ease-in-out;filter:drop-shadow(0 0 4px #d5c3ff)}
    @keyframes iconSpin{to{transform:rotate(-360deg)}}
    @keyframes iconReset{to{transform:rotate(-360deg)}}
    @keyframes iconFlip{0%{transform:rotateY(0)}48%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
    @keyframes bulbGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}35%{transform:scale(1.13);filter:drop-shadow(0 0 8px #ffc83d)}68%{transform:scale(1.04);filter:drop-shadow(0 0 4px #f7c642)}}
    @keyframes undoSweep{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(-2px) rotate(-16deg)}68%{transform:translateX(1px) rotate(5deg)}}
    @keyframes calendarNudge{0%,100%{transform:translateY(0)}35%{transform:translateY(-2px) rotate(-5deg)}70%{transform:translateY(1px) rotate(4deg)}}
    @keyframes sunSpin{to{transform:rotate(360deg)}}
    @keyframes moonRock{0%,100%{transform:rotate(0)}35%{transform:rotate(-18deg) scale(1.08)}70%{transform:rotate(10deg)}}
    @media(prefers-reduced-motion:reduce){#rotateBtn:hover .rotate-arrow,#flipBtn:hover svg,#hintBtn:hover svg,#undoBtn:hover svg,#resetBtn:hover svg,#datePickerBtn:hover svg,#themeToggle:hover .theme-icon svg{animation:none!important;filter:none!important}}
  </style>

      for(let d=29;d<=31;d++)labels.set(`${6},${d-29}`,{id:`d${d}`,text:`${d}日`,type:'day',value:d});
      for(let i=0;i<7;i++){const r=i<4?6:7,c=i<4?i+3:i;labels.set(`${r},${c}`,{id:`w${i}`,text:weekdays[i],type:'weekday',value:i})}

      document.querySelector('#confessionForm').addEventListener('submit',event=>{event.preventDefault();if(document.querySelector('#confessionInput').value.trim()==='我智商低'){closeHintModal();toastMsg('回答正确，继续挑战吧')}else document.querySelector('#confessionError').textContent='请准确输入“我智商低”后再点确定'});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&carry){event.preventDefault();cancelCarry(true);toastMsg('已取消拿起拼块')}else if(event.key==='Escape'&&document.querySelector('#hintModal').classList.contains('show'))event.preventDefault()});
      undoButton.addEventListener('click',()=>{if(roundCompletion||boardTransitioning||drag)return;if(carry)cancelCarry(true);const action=undoStack.pop();if(!action){toastMsg('没有可撤销的步骤');return}if(action.type==='place'||action.type==='hint')hasReturnedBoardPiece=true;if(action.type==='move'||action.type==='return'){if(action.cells)pieces.find(p=>p.id===action.id).cells=action.cells;placements.set(action.id,action.pos)}else if(action.type==='shape'){const piece=pieces.find(p=>p.id===action.id);piece.cells=action.cells}else if(action.type==='hint'){placements.delete(action.id);const piece=pieces.find(p=>p.id===action.id);piece.cells=action.cells}else placements.delete(action.id);closeWin();selected=null;renderBoard();renderTray();progress();replayFlipClock();toastMsg('已撤销上一步')});
      document.querySelector('#rotateBtn').addEventListener('click',()=>{if(drag)return;if(carry){if(transformCarried('rotate'))toastMsg('拼块已旋转');return}const p=pieces.find(p=>p.id===selected);if(p)rotate(p)&&toastMsg('拼块已旋转');else if(!p)toastMsg('先选择一块拼块')});
      document.querySelector('#flipBtn').addEventListener('click',()=>{if(drag)return;if(carry){if(transformCarried('flip'))toastMsg('拼块已翻转');return}const p=pieces.find(p=>p.id===selected);if(p)flip(p)&&toastMsg('拼块已翻转');else if(!p)toastMsg('先选择一块拼块')});
      document.querySelector('#datePickerBtn').addEventListener('click',()=>{const picker=document.querySelector('#datePicker');picker.showPicker?picker.showPicker():picker.click()});
      document.querySelector('#datePicker').addEventListener('change',e=>{if(e.target.value){const date=e.target.valueAsDate;if(date&&animateNewGame(date))toastMsg('目标日期已更新');else e.target.value=dateKey(targetDate)}});
      document.querySelector('#winClose').addEventListener('click',closeWin);
      setup(todayTarget());
    })();
  </script>
</body>
</html>
